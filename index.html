<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דטקטיב-סטטיסטיקאי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;700&family=Courier+Prime&family=Rubik:wght@700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-blue': '#1a2332',
                        'darker-blue': '#0f1420',
                        'gold': '#f4c430',
                        'gold-dim': 'rgba(244, 196, 48, 0.1)',
                        'light-gray': '#e8e8e8',
                        'paper': '#f0e6d2',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['Courier Prime', 'monospace'],
                        square: ['Rubik', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1a2332;
            color: #e8e8e8;
        }
        /* Custom scrollbar for game feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1420;
        }
        ::-webkit-scrollbar-thumb {
            background: #f4c430;
            border-radius: 4px;
        }
        .text-shadow {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .gold-glow {
            text-shadow: 0 0 10px rgba(244, 196, 48, 0.5);
        }
    </style>
<script type="importmap">

    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>

</head>

</html>
